name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest ruff
      - run: ruff check .
      # Offline tests only (httpx.MockTransport). Live smoke tests
      # (tests/test_smoke.py) hit the real API and stay out of CI.
      - run: pytest tests/test_retry.py -v
