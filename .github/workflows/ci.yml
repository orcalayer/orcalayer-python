name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest "ruff==0.15.*"
      - run: ruff check .
      # Offline tests only — live smoke tests are behind the `live` pytest
      # marker and excluded by addopts in pyproject.toml.
      - run: pytest -v
